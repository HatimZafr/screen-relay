<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How screen-relay works</title>
<script>
  var t = new URLSearchParams(location.search).get("theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  if (window.self === window.top) document.documentElement.setAttribute("data-top", "");
</script>
<style>
  :root {
    color-scheme: dark;
    --ds-background-100: oklch(0 0 0);
    --ds-background-200: oklch(0.027 0 0);
    --ds-gray-100: oklch(0.218 0 0);
    --ds-gray-400: oklch(0.301 0 0);
    --ds-gray-600: oklch(0.623 0 0);
    --ds-gray-900: oklch(0.706 0 0);
    --ds-gray-1000: oklch(0.946 0 0);
    --ds-blue-700: oklch(57.61% 0.2321 258.23);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --ds-background-100: oklch(1 0 0);
      --ds-background-200: oklch(0.984 0 0);
      --ds-gray-100: oklch(0.961 0 0);
      --ds-gray-400: oklch(0.937 0 0);
      --ds-gray-600: oklch(0.732 0 0);
      --ds-gray-900: oklch(0.42 0 0);
      --ds-gray-1000: oklch(0.205 0 0);
      --ds-blue-700: oklch(57.61% 0.2508 258.23);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ds-background-100: oklch(1 0 0);
    --ds-background-200: oklch(0.984 0 0);
    --ds-gray-100: oklch(0.961 0 0);
    --ds-gray-400: oklch(0.937 0 0);
    --ds-gray-600: oklch(0.732 0 0);
    --ds-gray-900: oklch(0.42 0 0);
    --ds-gray-1000: oklch(0.205 0 0);
    --ds-blue-700: oklch(57.61% 0.2508 258.23);
  }
  html, body { margin: 0; background: transparent; }
  :root[data-top], :root[data-top] body { background: var(--ds-background-100); }
  svg { display: block; width: 100%; height: auto; font-family: Geist, "Geist Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { fill: var(--ds-background-200); stroke: var(--ds-gray-400); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .node { fill: var(--ds-gray-100); }
  .engine { stroke: var(--ds-blue-700); }
  .label { fill: var(--ds-gray-1000); font-size: 14px; font-weight: 500; }
  .sub { fill: var(--ds-gray-900); font-size: 13px; }
  .head { fill: var(--ds-gray-900); font-size: 13px; font-weight: 500; }
  .tag { fill: var(--ds-gray-900); font-size: 12px; }
  .wire { fill: none; stroke: var(--ds-gray-600); stroke-width: 1; vector-effect: non-scaling-stroke; marker-end: url(#arrow); }
  .both { marker-start: url(#arrow); }
  .icon { fill: none; stroke: var(--ds-gray-900); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #arrow path { fill: none; stroke: var(--ds-gray-600); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<svg viewBox="0 0 720 288" role="img" aria-labelledby="t d">
  <title id="t">How screen-relay works</title>
  <desc id="d">Inside a Linux VM, the X11 or Wayland desktop sends its screen to the screen-relay engine. The engine streams video to the browser and receives mouse and keyboard input. An agent uses the CLI, SDK, or HTTP API to get screenshots and send input through the engine.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 1.5 L6 4 L2 6.5"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="16" width="424" height="136" rx="12"/>
  <text class="head" x="40" y="40">Linux VM</text>
  <rect class="box node" x="40" y="56" width="128" height="72" rx="6"/>
  <g class="icon" transform="translate(56 70)" aria-hidden="true"><rect x="1" y="1" width="14" height="10" rx="1.5"/><path d="M8 11v4M5 15h6"/></g>
  <text class="label" x="80" y="84">Desktop</text>
  <text class="sub" x="56" y="110">X11 or Wayland</text>
  <rect class="box node engine" x="224" y="56" width="192" height="72" rx="6"/>
  <g class="icon" transform="translate(240 70)" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/><path d="M6 0v3M10 0v3M6 13v3M10 13v3M0 6h3M0 10h3M13 6h3M13 10h3"/></g>
  <text class="label" x="264" y="84">screen-relay engine</text>
  <text class="sub" x="240" y="110">streams the screen</text>
  <rect class="box node" x="544" y="56" width="160" height="72" rx="6"/>
  <g class="icon" transform="translate(560 70)" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 3 4.1 3 6.5s-1 4.5-3 6.5C6 12.5 5 10.4 5 8s1-4.5 3-6.5z"/></g>
  <text class="label" x="584" y="84">Browser</text>
  <text class="sub" x="560" y="110">watch and control</text>
  <rect class="box node" x="248" y="200" width="144" height="72" rx="6"/>
  <g class="icon" transform="translate(264 214)" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="m4.5 6 2 2-2 2M8.5 10h3"/></g>
  <text class="label" x="288" y="228">Your agent</text>
  <text class="sub" x="264" y="254">CLI, SDK, or HTTP</text>
  <path class="wire" d="M172 92H220"/>
  <path class="wire" d="M420 84H540"/>
  <path class="wire" d="M540 100H420"/>
  <path class="wire both" d="M320 132V196"/>
  <text class="tag" x="196" y="81" text-anchor="middle">screen</text>
  <text class="tag" x="492" y="73" text-anchor="middle">video</text>
  <text class="tag" x="492" y="119" text-anchor="middle">clicks and keys</text>
  <text class="tag" x="312" y="182" text-anchor="end">screenshots and input</text>
</svg>
</body>
</html>
